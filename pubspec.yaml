name: find_missing_person
description: "FindMissingPerson - An app to search and report missing persons."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  intl: ^0.19.0
  url_launcher: ^6.3.0
  http: ^1.2.2
  crypto: ^3.0.6
  google_sign_in: ^6.2.1
  mailer: ^7.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
